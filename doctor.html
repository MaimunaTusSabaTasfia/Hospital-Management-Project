<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Login | Doldam Hospital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0D273D 0%, #1a4a6e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      max-width: 450px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .card-header {
      background: #0D273D;
      padding: 30px;
      text-align: center;
    }
    .card-header h1 { color: white; font-size: 1.8rem; margin-top: 10px; }
    .card-header p { color: #7bc5e8; font-size: 0.85rem; margin-top: 5px; }
    .card-header i { font-size: 3rem; color: #7bc5e8; }
    .card-body { padding: 35px; }
    .input-group { margin-bottom: 22px; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #0D273D; }
    .input-group i { margin-right: 8px; color: #2c9cd4; }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 16px;
      font-size: 1rem;
      transition: 0.2s;
    }
    .input-group input:focus { outline: none; border-color: #2c9cd4; }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #0D273D;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-btn:hover { background: #1a4a6e; transform: translateY(-2px); }
    .register-note {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
      color: #5a7e9a;
    }
    .register-note a { color: #2c9cd4; text-decoration: none; font-weight: 600; }
    .back-link { text-align: center; margin-top: 15px; }
    .back-link a { color: #5a7e9a; text-decoration: none; font-size: 0.8rem; }
    .error-msg {
      background: #fee;
      color: #c0392b;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.85rem;
    }
    .footer-note {
      background: #f8f9fa;
      padding: 15px;
      text-align: center;
      font-size: 0.7rem;
      color: #888;
    }
    .warning-banner {
      width: 100%;
      padding: 14px 18px;
      background: #ffe9d6;
      color: #8a4b00;
      border: 1px solid #f0c09d;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
<div id="serverWarning" class="warning-banner" style="display:none;"></div>
<div class="login-card">
  <div class="card-header">
    <i class="fas fa-stethoscope"></i>
    <h1>Doctor Portal</h1>
    <p>Secure access to patient records & dashboard</p>
  </div>
  <div class="card-body">
    <div id="errorMsg" class="error-msg"></div>
    <form id="doctorLoginForm" action="http://127.0.0.1:8000/login/?next=/dashboard/doctor/" method="post">
      <input type="hidden" name="next" value="/dashboard/doctor/">
      <div class="input-group">
        <label><i class="fas fa-user"></i> Username</label>
        <input type="text" id="doctorUsername" name="username" placeholder="Enter your username" required>
      </div>
      <div class="input-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="doctorPassword" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
    </form>
    <div class="register-note">
      <i class="fas fa-info-circle"></i> New doctors are added by hospital administration.<br>
      <a href="http://127.0.0.1:8000/index.html">← Back to Home</a>
    </div>
  </div>
  <div class="footer-note">
    <i class="fas fa-shield-alt"></i> Secure & Encrypted | Doldam Hospital
  </div>
</div>

<script>
  // This page now submits to Django login instead of using browser localStorage.
  // Access this page via the server URL: http://127.0.0.1:8000/doctor.html
  const warningEl = document.getElementById('serverWarning');
  const doctorForm = document.getElementById('doctorLoginForm');
  if (!['http:', 'https:'].includes(window.location.protocol)) {
    warningEl.innerText = 'Warning: this page must be opened through the Django server, for example http://127.0.0.1:8000/doctor.html';
    warningEl.style.display = 'block';
    doctorForm.addEventListener('submit', function(event) { event.preventDefault(); });
  }
</script>
</body>
</html>
