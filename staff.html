<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal | Doldam Hospital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0D273D 0%, #1a4a6e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .portal-container {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .tabs { display: flex; border-bottom: 1px solid #eee; }
    .tab { flex: 1; text-align: center; padding: 18px; cursor: pointer; font-weight: 600; color: #5a7e9a; }
    .tab.active { color: #0D273D; border-bottom: 3px solid #2c9cd4; }
    .form-container { padding: 35px; display: none; }
    .form-container.active { display: block; }
    .header-icon { text-align: center; margin-bottom: 20px; }
    .header-icon i { font-size: 3rem; color: #0D273D; }
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #0D273D; }
    .input-group input, .input-group select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0D273D;
      color: white;
      border: none;
      border-radius: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .error, .success { padding: 12px; border-radius: 12px; margin-bottom: 20px; display: none; }
    .error { background: #fee; color: #c0392b; }
    .success { background: #d4edda; color: #155724; }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: #2c9cd4; text-decoration: none; font-size: 0.85rem; }
    .warning-banner {
      width: 100%;
      padding: 14px 18px;
      background: #ffe9d6;
      color: #8a4b00;
      border: 1px solid #f0c09d;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
<div id="serverWarning" class="warning-banner" style="display:none;"></div>
<div class="portal-container">
  <div class="header-icon" style="text-align:center; padding:25px 0;">
    <i class="fas fa-clipboard-list"></i>
    <h2 style="margin-top:10px; color:#0D273D;">Staff Login</h2>
    <p style="color:#5a7e9a;">Access the staff dashboard using your Django credentials.</p>
  </div>

  <div id="loginForm" class="form-container active">
    <div id="loginError" class="error"></div>
    <form id="staffLoginForm" action="http://127.0.0.1:8000/login/?next=/dashboard/staff/" method="post">
      <input type="hidden" name="next" value="/dashboard/staff/">
      <div class="input-group"><label>Username</label><input type="text" id="loginUsername" name="username" required></div>
      <div class="input-group"><label>Password</label><input type="password" id="loginPassword" name="password" required></div>
      <button id="loginBtn">Login</button>
    </form>
    <div class="register-note" style="background:#eef4ff; color:#0b3d91; padding:16px; border-radius:16px; border:1px solid #d0e6ff; margin-top:20px;">
      Staff account creation is managed by hospital administration. Contact the admin if you need access.
    </div>
    <div class="back-link"><a href="http://127.0.0.1:8000/index.html">← Back to Home</a></div>
  </div>
</div>

<script>
  const warningEl = document.getElementById('serverWarning');
  const staffForm = document.getElementById('staffLoginForm');
  if (!['http:', 'https:'].includes(window.location.protocol)) {
    warningEl.innerText = 'Warning: this page must be opened through the Django server, for example http://127.0.0.1:8000/staff.html';
    warningEl.style.display = 'block';
    staffForm.addEventListener('submit', function(event) { event.preventDefault(); });
  }
</script>
</body>
</html>
