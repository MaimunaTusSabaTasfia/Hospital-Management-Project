<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact — Doldam Hospital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1> Contact Doldam Hospital</h1>
    <a href="index.html"> Home</a>
  </header>

  <section>
    <h2>Send Us a Message</h2>
    <form id="contactForm">
      <input id="c_name" placeholder="Your Name" required><br>
      <input id="c_email" type="email" placeholder="Your Email" required><br>
      <textarea id="c_message" placeholder="Your Message" required></textarea><br>
      <button type="submit">Send</button>
    </form>
  </section>

  <script>
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const messages = JSON.parse(localStorage.getItem('contactMessages') || '[]');
      messages.push({
        name: document.getElementById('c_name').value,
        email: document.getElementById('c_email').value,
        message: document.getElementById('c_message').value,
        date: new Date().toLocaleString()
      });
      localStorage.setItem('contactMessages', JSON.stringify(messages));
      alert(' Message sent! Thank you for contacting Doldam Hospital.');
      e.target.reset();
    });
  </script>
</body>
</html>
