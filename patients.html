<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration | Doldam Hospital</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0D273D 0%, #1a4a6e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .card-header {
      background: #0D273D;
      padding: 35px;
      text-align: center;
    }
    .card-header h1 { color: white; font-size: 1.8rem; margin-top: 12px; font-weight: 700; }
    .card-header p { color: #7bc5e8; font-size: 0.85rem; margin-top: 8px; }
    .card-header i { font-size: 3rem; color: #7bc5e8; }
    .card-body { padding: 35px; }
    .input-group { margin-bottom: 22px; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #0D273D; font-size: 0.9rem; }
    .input-group i { margin-right: 8px; color: #2c9cd4; width: 20px; }
    .input-group input, .input-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 16px;
      font-size: 1rem;
      font-family: inherit;
      transition: 0.2s;
    }
    .input-group input:focus, .input-group textarea:focus { outline: none; border-color: #2c9cd4; box-shadow: 0 0 0 3px rgba(44,156,212,0.1); }
    .btn {
      width: 100%;
      padding: 14px;
      background: #0D273D;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }
    .btn:hover { background: #1a4a6e; transform: translateY(-2px); }
    .btn-secondary { background: #2c9cd4; margin-top: 10px; }
    .btn-secondary:hover { background: #1a7ab0; }
    .success-msg {
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.85rem;
      text-align: center;
      background: #d4edda;
      color: #155724;
      border-left: 4px solid #155724;
    }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: #5a7e9a; text-decoration: none; font-size: 0.8rem; }
    .back-link a:hover { color: #2c9cd4; }
    .footer-note { background: #f8f9fa; padding: 15px; text-align: center; font-size: 0.7rem; color: #888; border-top: 1px solid #eee; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="card-header">
    <i class="fas fa-user-plus"></i>
    <h1>Patient Registration</h1>
    <p>Create your account to get started</p>
  </div>
  <div class="card-body">
    <div class="success-msg" style="display:block; background:#eef4ff; color:#0b3d91; border-left:4px solid #2c9cd4;">
      <i class="fas fa-info-circle"></i> Patient registration is handled by the Django backend. Click the button below to continue.
    </div>

    <button onclick="window.location.href='http://127.0.0.1:8000/register/patient/'" class="btn"><i class="fas fa-arrow-right"></i> Open Patient Registration</button>
    <button onclick="window.location.href='http://127.0.0.1:8000/patient.html'" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Patient Login</button>

    <div class="back-link">
      <a href="http://127.0.0.1:8000/index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
  <div class="footer-note">
    <i class="fas fa-shield-alt"></i> Secure & Encrypted | Doldam Hospital
  </div>
</div>

</body>
</html>
