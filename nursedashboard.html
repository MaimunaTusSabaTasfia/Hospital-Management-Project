<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nurse Dashboard | Doldam Hospital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #f0f7ff, #eef7e7); margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #0D273D; color: white; padding: 20px; border-radius: 18px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1.8rem; }
    .btn { border: none; border-radius: 12px; padding: 12px 18px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #2c9cd4; color: #fff; }
    .btn-logout { background: #c0392b; color: #fff; }
    .card { background: white; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); margin-bottom: 20px; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 12px; border-bottom: 1px solid #e0e0e0; text-align: left; }
    th { background: #e8f4ff; }
    textarea, input { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #ccc; }
    .problems-list { list-style: none; padding: 0; }
    .problems-list li { margin-bottom: 10px; background: #f8f9fb; padding: 12px; border-radius: 12px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Nurse Dashboard</h1>
      <p>Welcome to your nurse workspace.</p>
    </div>
    <div>
      <button class="btn btn-primary" onclick="window.location.href='index.html'">Home</button>
      <button class="btn btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="card grid">
    <div>
      <h2>My Profile</h2>
      <div id="welcome"></div>
      <div id="nurseDetails"></div>
    </div>
    <div>
      <h2>Achievements</h2>
      <canvas id="achievementsChart" height="200"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Report a Workplace Problem</h2>
    <form id="problemForm">
      <textarea id="problemText" placeholder="Describe the issue..." rows="4" required></textarea>
      <button type="submit" class="btn btn-primary" style="margin-top:12px;">Submit Report</button>
    </form>
  </div>

  <div class="card">
    <h2>Previous Problems</h2>
    <ul id="problemsList" class="problems-list"></ul>
  </div>
</div>

<script src="nurse.js"></script>
</body>
</html>
